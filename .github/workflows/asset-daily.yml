# ==========================================================================
# 자산 현황 매일 요약
# ==========================================================================
# 매일 아침 계좌별(일반·연금저축·퇴직연금·ISA …) 평가액과 어제·이달 1일
# 대비 증감을 텔레그램으로 보냅니다.
#
# [준비]  저장소 → Settings → Secrets and variables → Actions 에 아래 4개.
#
#           TELEGRAM_TOKEN      텔레그램 봇 토큰                (필수)
#           TELEGRAM_CHAT_ID    내 chat_id                      (필수)
#           GIST_TOKEN          gist 권한을 준 개인 토큰(PAT)    (필수)
#           GIST_ID             자료가 들어 있는 비공개 Gist id  (필수)
#
#         ※ 환율 요약과 달리 Gist 가 꼭 필요합니다. 내 종목 목록은 공개
#           자료가 아니라 앱이 저장해 둔 내 자료이기 때문입니다.
#           앱에서 자산배분 화면을 열고 한 번 저장해 두어야 합니다.
#
# [확인]  Actions 탭 → 이 워크플로 → Run workflow 로 한 번 직접 돌려보세요.
#         처음 돌린 날에는 비교할 어제 값이 없어 증감 줄이 안 나옵니다.
#
# [시간 바꾸기]  아래 cron 을 고칩니다. **시간은 UTC 입니다** (한국시간 -9h).
#           "0 22 * * *"    한국시간 매일 07:00  ← 지금 설정
#           "0 23 * * *"    한국시간 매일 08:00
#
# [참고]  pip install 이 없습니다. engines/portfolio.py 가 파이썬 기본
#         모듈만 쓰기 때문입니다.
# ==========================================================================

name: 자산 현황 매일 요약

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "계산만 하고 저장·전송은 하지 않음"
        type: boolean
        default: false

# 앞선 실행이 아직 돌고 있으면 겹치지 않게 기다립니다.
# 두 개가 동시에 Gist 를 쓰면 한쪽 기록이 사라집니다.
concurrency:
  group: asset-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 자산 요약 발송
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/asset_check.py
