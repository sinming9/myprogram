# ==========================================================================
# 호텔 가격 자동 감시
# ==========================================================================
# Streamlit 앱은 아무도 안 보면 잠들어서 가격을 확인할 수 없습니다.
# 그래서 GitHub Actions 가 정해진 시간마다 대신 확인하고 알림을 보냅니다.
#
# [준비]  저장소 → Settings → Secrets and variables → Actions →
#         New repository secret 으로 아래 6개를 넣으세요.
#
#           RAPIDAPI_KEY       RapidAPI 키                      (필수)
#           RAPIDAPI_HOST      booking-com15.p.rapidapi.com
#           GIST_TOKEN         gist 권한을 준 개인 토큰(PAT)      (필수)
#           GIST_ID            자료가 들어 있는 비공개 Gist id    (필수)
#
#         알림은 아래 중 쓰실 것만 넣으면 됩니다 (둘 다 넣어도 됩니다).
#           KAKAO_REST_KEY       카카오 REST API 키
#           KAKAO_REFRESH_TOKEN  리프레시 토큰 (화면에서 복사)
#           KAKAO_CLIENT_SECRET  앱에서 켜뒀다면
#           TELEGRAM_TOKEN       텔레그램 봇 토큰
#           TELEGRAM_CHAT_ID     내 chat_id
#
#         ※ 이름을 GITHUB_GIST_TOKEN 으로 만들 수 없습니다.
#           GitHub 이 GITHUB_ 접두사를 예약해 두었습니다.
#
#         ※ KAKAO_REFRESH_TOKEN 은 **처음 한 번의 씨앗**입니다.
#           카카오 토큰은 6시간마다 만료되고 리프레시 토큰도 2개월마다
#           바뀌는데, 워크플로는 자기 Secret 을 고칠 수 없습니다.
#           그래서 갱신된 토큰은 Gist 에 저장하고 그쪽을 우선으로 씁니다.
#           한 번 넣은 뒤로는 이 Secret 을 손댈 필요가 없습니다.
#
# [확인]  Actions 탭 → 이 워크플로 → Run workflow 로 한 번 직접 돌려보세요.
#
# [주기 바꾸기]  아래 cron 을 고칩니다. **시간은 UTC 입니다** (한국시간 -9h).
#           "0 */6 * * *"   6시간마다  ← 지금 설정
#           "0 */3 * * *"   3시간마다
#           "0 0,12 * * *"  하루 두 번 (한국시간 09시·21시)
#           "0 21 * * *"    하루 한 번 (한국시간 06시)
#
#         너무 자주 돌리면 RapidAPI 무료 할당량을 금방 씁니다.
#         감시 3건 × 6시간마다 = 하루 12회 = 한 달 약 360회입니다.
#
# [참고]  이 작업은 pip install 이 없습니다. engines/hotel.py 가 파이썬
#         기본 모듈만 쓰기 때문입니다. 그래서 20초 안에 끝납니다.
# ==========================================================================

name: 호텔 가격 감시

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "조회만 하고 저장·알림은 하지 않음"
        type: boolean
        default: false

# 앞선 실행이 아직 돌고 있으면 겹치지 않게 기다립니다.
# 두 개가 동시에 Gist 를 쓰면 한쪽 기록이 사라집니다.
concurrency:
  group: hotel-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 가격 확인
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/hotel_check.py
