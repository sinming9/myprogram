# ==========================================================================
# Streamlit 실행 설정
# ==========================================================================
# 이 파일은 비밀 정보가 없으므로 git 에 올려도 됩니다.
# (비밀번호·토큰은 secrets.toml 에 넣습니다)
# ==========================================================================

[browser]
# 사용 통계를 보내지 않습니다.
gatherUsageStats = false

[theme]
# ★ 2026-11 첫 화면 개편: 다크 테마로 고정합니다 (시안의 색 규칙).
#   예전에는 비워 두어 PC·휴대폰의 다크/라이트 설정을 따라갔습니다.
#   라이트로 되돌리려면 아래 세 줄을 지우면 됩니다.
base = "dark"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161B26"
# 버튼·탭 강조색. 기본(빨강)은 '상승' 색과 헷갈려 회색으로 둡니다.
primaryColor = "#C9CED8"
